<script>
  try {
    var savedTheme = localStorage.getItem('ctf-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') {
      document.documentElement.dataset.theme = savedTheme;
    }
  } catch (e) { /* storage may be blocked; dark theme is the default */ }
</script>
