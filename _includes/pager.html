<nav class="pager" aria-label="Writeup pagination">
  {% if page.previous.url %}
    <a href="{{ page.previous.url | relative_url }}"><small>&larr; previous</small><span>{{ page.previous.title }}</span></a>
  {% else %}<span></span>{% endif %}
  {% if page.next.url %}
    <a class="pager__next" href="{{ page.next.url | relative_url }}"><small>next &rarr;</small><span>{{ page.next.title }}</span></a>
  {% else %}<span></span>{% endif %}
</nav>
