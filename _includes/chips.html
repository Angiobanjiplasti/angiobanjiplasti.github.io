{% if include.categories and include.categories.size > 0 %}
  <div class="chips">
    {% for cat in include.categories %}
      {% assign meta = site.category_meta[cat] %}
      <a class="chip chip--cat" href="{{ '/categories/' | relative_url }}#{{ cat | slugify }}">{{ meta.label | default: cat }}</a>
    {% endfor %}
    {% if include.tags %}
      {% for tag in include.tags %}
        <a class="chip chip--tag" href="{{ '/tags/' | relative_url }}#{{ tag | slugify }}">#{{ tag }}</a>
      {% endfor %}
    {% endif %}
  </div>
{% endif %}
