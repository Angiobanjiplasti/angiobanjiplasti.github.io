# -----------------------------------------------------------------------------
# CTF Notes — site configuration
# Copy this folder to GitHub as the root of your repository.
# Before pushing: set `url`, `baseurl` and `author` below.
# -----------------------------------------------------------------------------

title: CTF Notes
description: Writeups, notes and dead ends from CTFs and security practice.
lang: en

# User site repo with a custom domain (CNAME: angio.bezv.uk).
# baseurl stays empty because the site is served from the domain root.
url: "https://angio.bezv.uk"
baseurl: ""

author:
  name: Angiobanjiplasti
  github: Angiobanjiplasti
  email: ""

# -----------------------------------------------------------------------------
# Build settings (GitHub Pages compatible)
# -----------------------------------------------------------------------------
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  # KaTeX is loaded in the browser; kramdown emits \(...\) and \[...\] which
  # the auto-renderer picks up. See _includes/math.html.
  math_engine: mathjax
  smart_quotes: ["apos", "apos", "quot", "quot"]
  syntax_highlighter_opts:
    block:
      line_numbers: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

paginate: 10
permalink: /writeups/:year/:month/:day/:title/

collections:
  events:
    output: true
    permalink: /events/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: events
    values:
      layout: event

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
  - .gitignore

# -----------------------------------------------------------------------------
# Theme options
# -----------------------------------------------------------------------------
appearance:
  toc: true
  search: true
  code_copy: true
  spoiler_blur: true
  # Accent colour: "mint" or "amber". Change the CSS variables in
  # _sass/_base.scss if you want a different palette.
  accent: mint

katex_version: "0.16.11"

nav:
  - title: Writeups
    url: /
  - title: Events
    url: /events/
  - title: Categories
    url: /categories/
  - title: Tags
    url: /tags/
  - title: Search
    url: /search/
  - title: About
    url: /about/

# Display metadata for challenge categories. Jekyll owns `site.categories`,
# so this deliberately uses a different key.
category_meta:
  web:
    label: Web
    icon: "<>"
    description: Injection, auth bugs, client-side tricks
  crypto:
    label: Crypto
    icon: "sum"
    description: Ciphers, maths, keys and signatures
  pwn:
    label: Pwn
    icon: "$_"
    description: Memory corruption and exploitation
  reverse:
    label: Reverse
    icon: "0x"
    description: Binaries, bytecode and decompilation
  forensics:
    label: Forensics
    icon: "??"
    description: Packets, disks, images and logs
  misc:
    label: Misc
    icon: "~~"
    description: Everything else
