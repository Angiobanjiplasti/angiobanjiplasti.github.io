<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" data-theme="dark" data-accent="{{ site.appearance.accent | default: 'mint' }}" data-blur="{{ site.appearance.spoiler_blur }}" data-code-copy="{{ site.appearance.code_copy }}">
<head>
  {% include head.html %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="container">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
